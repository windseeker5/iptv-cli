# Copy to ~/.config/kdtv/kdtv.toml (or ./kdtv.toml). Paths are relative to this file; ~ works.
profile = "home"                 # shown in the header; "travel" on the laptop

# The KDTV folder: data/ and .env live here.
cli_dir = "~/Documents/DEV/kdtv/cli"

# Optional overrides
# records_dir   = "~/Videos/kd"          # default: USB_RECORDS_PATH from .env
# downloads_dir = "~/Videos/kd/downloads" # default: <cli_dir>/data/downloads
# compose_dir   = "~/Documents/DEV"       # where docker-compose.yml is (default: two folders up)
# watch_url     = "https://live.dresdell.com/"
# containers    = ["iptv-nginx-rtmp", "iptv-jellyfin", "caddy", "omt"]
# icons        = false                   # no Nerd Font on this terminal (e.g. a Pi console)
