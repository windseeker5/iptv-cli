<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDC Live TV - Streaming</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- HLS.js for video playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Cast SDK for Chromecast support -->
    <script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    
    <!-- Bootstrap 5 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 65, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 180, 216, 0.03) 0%, transparent 50%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }
        
        .logo {
            height: 90px;
            width: auto;
        }

        .video-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 2px solid #1a1a1a;
        }
        
        #video {
            width: 100%;
            height: 100%;
            display: block;
            background: #111;
            border: none;
        }
        
        .cast-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #334155;
            color: white;
            padding: 6px 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .cast-badge:hover {
            background: rgba(31, 41, 55, 0.95);
            border-color: #22c55e;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
        }

        .cast-badge svg {
            width: 16px;
            height: 16px;
        }

        .cast-badge.casting {
            background: rgba(34, 197, 94, 0.25);
            border-color: #22c55e;
            animation: castPulse 1.8s infinite;
        }

        @keyframes castPulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
            70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top: 2px solid #00ff41;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            text-align: center;
            font-size: 16px;
        }
        
        .stream-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 12px;
            color: #ccc;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .video-container:hover .stream-info {
            opacity: 1;
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #ff4444;
            font-weight: bold;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            animation: blink 1s infinite alternate;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        
        /* Badge Container */
        .badge-container {
            width: 90vw;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Jellyfin Badge */
        .jellyfin-badge {
            z-index: 1000;
            transition: all 0.3s ease;
            text-decoration: none;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid transparent;
            font-size: 12px;
            display: flex;
            align-items: center;
            padding: 6px 12px;
        }
        
        .jellyfin-badge:hover {
            transform: scale(1.1);
            text-decoration: none;
        }
        
        .jellyfin-badge.online {
            background: rgba(34, 197, 94, 0.9);
            color: white;
            border-color: #22c55e;
            box-shadow: 0 3px 12px rgba(34, 197, 94, 0.3);
        }
        
        .jellyfin-badge.online:hover {
            background: rgba(34, 197, 94, 1);
            color: white;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
        }
        
        .jellyfin-badge.offline {
            background: rgba(107, 114, 128, 0.9);
            color: white;
            border-color: #6b7280;
            cursor: not-allowed;
            box-shadow: 0 3px 12px rgba(107, 114, 128, 0.3);
        }
        
        .jellyfin-badge .badge-icon {
            width: 12px;
            height: 12px;
            margin-right: 4px;
        }

        .viewer-badge {
            z-index: 1000;
            border-radius: 15px;
            border: 1px solid #0f8f42;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #86efac;
            box-shadow: 0 3px 12px rgba(34, 197, 94, 0.2);
        }

        .viewer-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            margin-right: 6px;
        }

        /* No Stream Card - Same dimensions as video-container */
        .no-stream-card {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 15px;
            border: 2px solid #1a1a1a;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-sizing: border-box;
        }

        .no-stream-icon {
            color: #00ff41;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .no-stream-card h2 {
            color: #e0e0e0;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .no-stream-card p {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }

        .btn-dashboard {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #00ff41 0%, #00cc33 100%);
            color: #000;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-dashboard:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 65, 0.4);
            color: #000;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .video-container {
                width: 95vw;
            }

            .no-stream-card {
                width: 95vw;
                padding: 30px 20px;
            }

            .no-stream-card h2 {
                font-size: 1.3rem;
            }

            .no-stream-card p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container" style="position: relative;">
        <!-- Header Row: Logo + Jellyfin Badge -->
        <div class="badge-container">
            <img src="kdc-logo-transparent.png" alt="KDC" class="logo">
            <div class="top-actions">
                <span class="viewer-badge" id="viewer-badge" title="Active viewers in the last 45 seconds">
                    <span class="dot"></span>
                    <span id="viewer-count">Viewers: 0</span>
                </span>

                <button class="cast-badge" id="cast-btn" title="Cast to TV" style="display: none;" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                    </svg>
                </button>

                <a href="#" class="jellyfin-badge badge px-2 py-1 offline" id="jellyfin-badge">
                    <svg class="badge-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12.0003 2.00037L13.09 8.26037L20 7L14.5 12.74L20.5 14L13.08 15.74L12 22L10.91 15.74L4 17L9.5 11.26L3.5 10L10.92 8.26L12.0003 2.00037Z"/>
                    </svg>
                    <span id="jellyfin-status">Jellyfin</span>
                </a>
            </div>
        </div>
        
        <div class="video-container">
            <video id="video" controls autoplay muted playsinline></video>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Connecting to stream...
            </div>
            
            <div class="error" id="error" style="display: none;">
                <div>⚠️ Stream not available</div>
                <div style="margin-top: 10px; font-size: 14px;">
                    Check if a stream is active or try refreshing the page
                </div>
            </div>
            
            <div class="stream-info">
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    LIVE
                </div>
                <div id="stream-url">Loading...</div>
            </div>
            
        </div>

        <!-- No Stream Card -->
        <div class="no-stream-card" id="no-stream" style="display: none;">
            <div class="no-stream-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
            </div>
            <h2>No stream is currently active</h2>
            <p>Use the IPTV application to start a restream</p>
            <a href="/" class="btn-dashboard">Back to Dashboard</a>
        </div>
    </div>

    <script>
        class LiveStreamPlayer {
            constructor() {
                this.jellyfinUrl = 'https://tv.dresdell.com';
                this.video = document.getElementById('video');
                this.loading = document.getElementById('loading');
                this.error = document.getElementById('error');
                this.streamUrl = document.getElementById('stream-url');
                this.castBtn = document.getElementById('cast-btn');
                this.viewerCount = document.getElementById('viewer-count');
                this.jellyfinBadge = document.getElementById('jellyfin-badge');
                this.jellyfinStatus = document.getElementById('jellyfin-status');
                this.videoContainer = document.querySelector('.video-container');
                this.noStreamCard = document.getElementById('no-stream');

                this.currentStream = null;
                this.hls = null;
                this.castSession = null;

                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.initializeCast();
                this.checkJellyfinStatus();
                this.detectStream();
                this.updateViewerCount();
                
                // Check Jellyfin status every 30 seconds
                setInterval(() => this.checkJellyfinStatus(), 30000);
                setInterval(() => this.updateViewerCount(), 10000);
            }

            getViewerEndpoints() {
                const sameOrigin = `${window.location.origin}/api/viewers`;
                const publicOrigin = `${this.jellyfinUrl}/api/viewers`;

                if (window.location.port === '8080') {
                    return [publicOrigin, sameOrigin];
                }

                return [sameOrigin, publicOrigin];
            }

            async updateViewerCount() {
                const endpoints = this.getViewerEndpoints();

                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(`${endpoint}?t=${Date.now()}`, {
                            cache: 'no-store'
                        });

                        if (!response.ok) {
                            continue;
                        }

                        const data = await response.json();
                        const count = Number.isInteger(data.active_viewers) ? data.active_viewers : 0;
                        this.viewerCount.textContent = `Viewers: ${count}`;
                        return;
                    } catch (error) {
                        continue;
                    }
                }

                this.viewerCount.textContent = 'Viewers: --';
            }
            
            setupEventListeners() {
                // Video events
                this.video.addEventListener('loadstart', () => this.showLoading());
                this.video.addEventListener('loadeddata', () => this.hideLoading());
                this.video.addEventListener('error', () => this.showError());
                
                // Auto-retry on error
                this.video.addEventListener('error', () => {
                    setTimeout(() => this.detectStream(), 5000);
                });
            }
            
            initializeCast() {
                // Initialize Cast API
                window['__onGCastApiAvailable'] = (isAvailable) => {
                    if (isAvailable) {
                        cast.framework.CastContext.getInstance().setOptions({
                            receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
                            autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
                        });
                        
                        this.castBtn.style.display = 'block';
                        this.castBtn.addEventListener('click', () => this.toggleCast());
                        
                        // Listen for cast state changes
                        cast.framework.CastContext.getInstance().addEventListener(
                            cast.framework.CastContextEventType.CAST_STATE_CHANGED,
                            (event) => this.onCastStateChanged(event)
                        );
                    }
                };
            }
            
            async detectStream() {
                // Get current URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                let streamKey = urlParams.get('stream');

                // If no stream specified, try to detect active streams
                if (!streamKey) {
                    try {
                        const response = await fetch('/stat');
                        const xmlText = await response.text();
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                        // Find first active stream
                        const applications = xmlDoc.getElementsByTagName('application');
                        for (let app of applications) {
                            const live = app.getElementsByTagName('live');
                            if (live.length > 0) {
                                const streams = live[0].getElementsByTagName('stream');
                                if (streams.length > 0) {
                                    const name = streams[0].getElementsByTagName('name')[0];
                                    if (name) {
                                        streamKey = name.textContent;
                                        break;
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.log('Could not detect active streams');
                    }
                }

                // If no active stream found, show the no-stream card
                if (!streamKey) {
                    this.showNoStream();
                    return;
                }

                // Stream found, show player and load it
                this.hideNoStream();
                this.loadStream(streamKey);
            }
            
            loadStream(streamKey) {
                const streamUrl = `/hls/${streamKey}.m3u8`;
                this.currentStream = streamKey;
                
                this.streamUrl.textContent = streamUrl;
                
                // Destroy existing HLS instance
                if (this.hls) {
                    this.hls.destroy();
                }
                
                if (Hls.isSupported()) {
                    this.hls = new Hls({
                        enableWorker: false,
                        lowLatencyMode: true,
                        backBufferLength: 90
                    });
                    
                    this.hls.loadSource(streamUrl);
                    this.hls.attachMedia(this.video);
                    
                    this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        this.video.play().catch(e => {
                            console.log('Autoplay prevented:', e);
                            // Show play button overlay if autoplay fails
                        });
                    });
                    
                    this.hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            this.showError();
                            // Retry after 5 seconds
                            setTimeout(() => this.loadStream(streamKey), 5000);
                        }
                    });
                } else if (this.video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS support
                    this.video.src = streamUrl;
                } else {
                    this.showError();
                }
            }
            
            toggleCast() {
                const castContext = cast.framework.CastContext.getInstance();
                if (castContext.getCastState() === cast.framework.CastState.CONNECTED) {
                    castContext.endCurrentSession(true);
                } else {
                    castContext.requestSession().then(() => {
                        this.startCasting();
                    }).catch(e => {
                        console.log('Cast request failed:', e);
                    });
                }
            }
            
            startCasting() {
                const castSession = cast.framework.CastContext.getInstance().getCurrentSession();
                if (castSession && this.currentStream) {
                    const mediaInfo = new chrome.cast.media.MediaInfo(`${window.location.origin}/hls/${this.currentStream}.m3u8`, 'application/x-mpegurl');
                    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
                    mediaInfo.metadata.title = 'Live TV CLI';
                    mediaInfo.metadata.subtitle = `Stream: ${this.currentStream}`;
                    
                    const request = new chrome.cast.media.LoadRequest(mediaInfo);
                    castSession.loadMedia(request).catch(e => {
                        console.log('Cast load failed:', e);
                    });
                }
            }
            
            onCastStateChanged(event) {
                const castState = event.castState;
                const castBtn = this.castBtn;
                
                switch (castState) {
                    case cast.framework.CastState.CONNECTED:
                        castBtn.classList.add('casting');
                        castBtn.title = 'Disconnect from TV';
                        break;
                    case cast.framework.CastState.NOT_CONNECTED:
                        castBtn.classList.remove('casting');
                        castBtn.title = 'Cast to TV';
                        break;
                }
            }
            
            showLoading() {
                this.loading.style.display = 'flex';
                this.error.style.display = 'none';
            }
            
            hideLoading() {
                this.loading.style.display = 'none';
                this.error.style.display = 'none';
            }
            
            showError() {
                this.loading.style.display = 'none';
                this.error.style.display = 'block';
            }

            showNoStream() {
                this.videoContainer.style.display = 'none';
                this.noStreamCard.style.display = 'flex';
                this.loading.style.display = 'none';
            }

            hideNoStream() {
                this.noStreamCard.style.display = 'none';
                this.videoContainer.style.display = 'block';
            }

            async checkJellyfinStatus() {
                fetch(`${this.jellyfinUrl}/health?t=${Date.now()}`, {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-store'
                })
                    .then(() => this.setJellyfinOnline())
                    .catch(() => this.setJellyfinOffline());
            }
            
            setJellyfinOnline() {
                this.jellyfinBadge.classList.remove('offline');
                this.jellyfinBadge.classList.add('online');
                this.jellyfinBadge.href = this.jellyfinUrl;
                this.jellyfinBadge.style.cursor = 'pointer';
                this.jellyfinStatus.textContent = 'Jellyfin';
                this.jellyfinBadge.title = 'Open Jellyfin Media Server';
                
                // Remove click prevention
                this.jellyfinBadge.onclick = null;
            }
            
            setJellyfinOffline() {
                this.jellyfinBadge.classList.remove('online');
                this.jellyfinBadge.classList.add('offline');
                this.jellyfinBadge.href = '#';
                this.jellyfinBadge.style.cursor = 'not-allowed';
                this.jellyfinStatus.textContent = 'Jellyfin';
                this.jellyfinBadge.title = 'Jellyfin Media Server is offline';
                
                // Prevent click when offline
                this.jellyfinBadge.onclick = (e) => {
                    e.preventDefault();
                    return false;
                };
            }
        }
        
        // Initialize player when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new LiveStreamPlayer();
        });
        
        // Handle URL changes for different streams
        window.addEventListener('popstate', () => {
            if (window.player) {
                window.player.detectStream();
            }
        });
    </script>
</body>
</html>
